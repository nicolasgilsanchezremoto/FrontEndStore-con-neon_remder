<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - FRONTEND STORE</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header"><a href="index.html"><img class="header_logo" src="img/logo.png" alt="Logotipo"></a></header>
    <main class="contenedor">
        <h1>Registro de Cliente</h1>
        <form id="formRegistro" class="formulario" style="max-width: 600px; margin: 0 auto;">
            <input class="formulario__campo" type="text" id="nombre" placeholder="Nombre Completo" required>
            <input class="formulario__campo" type="number" id="cedula" placeholder="Cédula" required>
            <input class="formulario__campo" type="number" id="celular" placeholder="Celular" required>
            <input class="formulario__campo" type="email" id="correo" placeholder="Correo Electrónico" required>
            <input class="formulario__campo" type="text" id="direccion" placeholder="Dirección de Vivienda" required>
            <input class="formulario__campo" type="password" id="password" placeholder="Contraseña" required>
            
            <h3 style="grid-column: 1/3; margin-bottom: 0;">Método de Pago (Visual)</h3>
            <select class="formulario__campo" id="banco" required>
                <option value="" disabled selected>--Seleccione un Banco--</option>
                <option value="Bancolombia">Bancolombia</option>
                <option value="Davivienda">Davivienda</option>
                <option value="Nequi">Nequi</option>
                <option value="Daviplata">Daviplata</option>
                <option value="Banco de Bogota">Banco de Bogotá</option>
            </select>
            <!-- Pattern obliga a escribir exactamente 16 dígitos -->
            <input class="formulario__campo" type="text" id="tarjeta" placeholder="Nº de Tarjeta (16 dígitos)" pattern="[0-9]{16}" title="Debe contener exactamente 16 números" required>
            
            <input class="formulario__submit" type="submit" value="Registrarme">
        </form>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
