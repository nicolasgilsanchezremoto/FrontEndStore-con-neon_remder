<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta Dev - FRONTEND STORE</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Staatliches&display=swap" rel="stylesheet">
    <style>
        .ruleta-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 3rem auto;
            text-align: center;
        }

        .ruleta-box {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 2rem 0;
        }

        .ruleta {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid var(--secundario);
            background: conic-gradient(
                #89119d 0deg 72deg,
                #ffce08 72deg 144deg,
                #9c27b0 144deg 216deg,
                #4caf50 216deg 288deg,
                #e91e63 288deg 360deg
            );
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .indicador {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid var(--blanco);
            z-index: 10;
        }

        .btn-girar {
            background-color: var(--secundario);
            color: var(--negro);
            font-family: var(--fuentePrincipal);
            font-size: 2.5rem;
            padding: 1rem 3rem;
            border: none;
            cursor: pointer;
            border-radius: 0.5rem;
            transition: background-color 0.3s;
        }

        .btn-girar:hover {
            background-color: var(--secundarioOscuro);
        }

        .btn-girar:disabled {
            background-color: #888;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html">
            <img class="header_logo" src="logo.png" alt="Logotipo">
        </a>
    </header>

    <nav class="navegacion">
        <a class="navegacion_enlace" href="index.html">Tienda</a>
        <a class="navegacion_enlace" href="nosotros.html">Nosotros</a>
        <a class="navegacion_enlace navegacion_enlace--activo" href="juego.html">🎮 Gana Saldo</a>
        <span id="userMenu" style="margin-left: auto; display: flex; gap: 1rem; align-items: center; margin-right: 2rem;"></span>
    </nav>

    <main class="contenedor ruleta-container">
        <h1>Ruleta de la Suerte Dev</h1>
        <p>¡Gira la ruleta y gana premios en efectivo directo a tu monedero para seguir comprando!</p>

        <div class="ruleta-box">
            <div class="indicador"></div>
            <div id="ruleta" class="ruleta"></div>
        </div>

        <button id="btnGirar" onclick="jugarRuleta()" class="btn-girar">¡GIRAR AHORA!</button>
        <h2 id="mensajePremio" style="margin-top: 2rem; color: var(--secundario);"></h2>
    </main>

    <footer class="footer">
        <p class="footer__texto">Front End Store - Todos los derechos reservados 2026</p>
    </footer>

    <script src="js/app.js"></script>
    <script>
        let girando = false;

        async function jugarRuleta() {
            if (!usuarioActual) {
                alert("Debes iniciar sesión para poder jugar.");
                window.location.href = 'login.html';
                return;
            }

            if (girando) return;
            girando = true;

            const btn = document.getElementById('btnGirar');
            const ruleta = document.getElementById('ruleta');
            const mensaje = document.getElementById('mensajePremio');

            btn.disabled = true;
            mensaje.textContent = "Girando...";

            // Premios posibles y sus grados de rotación
            const opciones = [
                { premio: 5000, grados: 1440 + 36 },   // 5 rotaciones + ángulo
                { premio: 10000, grados: 1440 + 108 },
                { premio: 15000, grados: 1440 + 180 },
                { premio: 20000, grados: 1440 + 252 },
                { premio: 25000, grados: 1440 + 324 }
            ];

            // Seleccionar premio al azar
            const seleccion = opciones[Math.floor(Math.random() * opciones.length)];

            // Aplicar animación CSS
            ruleta.style.transform = `rotate(${seleccion.grados}deg)`;

            // Esperar 4 segundos que dura la animación
            setTimeout(async () => {
                try {
                    const res = await fetch(`${API_URL}/recargar`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            usuario_id: usuarioActual.id,
                            monto: seleccion.premio
                        })
                    });

                    const data = await res.json();

                    if (data.success) {
                        mensaje.textContent = `¡Felicidades! Ganaste $${seleccion.premio.toLocaleString()} abonados a tu monedero.`;
                        
                        // Actualizar en el cliente
                        usuarioActual.saldo = data.nuevoSaldo;
                        localStorage.setItem('usuario', JSON.stringify(usuarioActual));
                        renderUserMenu();
                    } else {
                        mensaje.textContent = "Hubo un problema al abonar el premio.";
                    }
                } catch (error) {
                    mensaje.textContent = "Error de conexión con el servidor.";
                }

                // Reiniciar estado
                setTimeout(() => {
                    ruleta.style.transition = 'none';
                    ruleta.style.transform = 'rotate(0deg)';
                    setTimeout(() => {
                        ruleta.style.transition = 'transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99)';
                        btn.disabled = false;
                        girando = false;
                    }, 50);
                }, 2000);

            }, 4000);
        }
    </script>
</body>
</html>
