<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - FRONTEND STORE</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header"><a href="index.html"><img class="header_logo" src="logo.png" alt="Logotipo"></a></header>
    <main class="contenedor">
        <h1>Iniciar Sesión</h1>
        <form id="formLogin" class="formulario" style="max-width: 400px; margin: 0 auto; display: flex; flex-direction: column;">
            <input class="formulario__campo" type="email" id="loginCorreo" placeholder="Correo Electrónico" required>
            <input class="formulario__campo" type="password" id="loginPassword" placeholder="Contraseña" required>
            <input class="formulario__submit" type="submit" value="Ingresar">
            <a href="registro.html" style="text-align: center; margin-top: 1rem; color: var(--blanco);">¿No tienes cuenta? Regístrate y gana $30.000</a>
        </form>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
